            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: Bearer {{ _.token_vet }}

      - name: Tutor tentando prescrever (espera 403)
        meta:
          id: req_403_tutor_prescreve
          sortKey: -350
        method: POST
        url: "{{ _.base_url }}/tratamentos"
        body:
          mimeType: application/json
          text: |-
            {
              "petId": 1,
              "medicamento": "Teste",
              "dosagem": "1 comprimido",
              "intervaloHoras": 12,
              "duracaoDias": 5,
              "inicioEm": "2026-09-01T08:00:00"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: Bearer {{ _.token_tutor }}

      - name: ID nao numerico na rota (espera 400)
        meta:
          id: req_400_id_invalido
          sortKey: -300
        method: GET
        url: "{{ _.base_url }}/pets/abc"
        headers:
          - name: Authorization
            value: Bearer {{ _.token_tutor }}

      - name: Requisicao sem token (espera 401)
        meta:
