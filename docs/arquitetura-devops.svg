<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Olli Pet - Arquitetura DevOps (ACR + ACI)</text>
  <text x="600" y="60" text-anchor="middle" font-size="14" fill="#475569">Solucao 100% containerizada: App e Banco no mesmo grupo de containers do Azure Container Instances</text>

  <!-- Personas -->
  <g>
    <circle cx="90" cy="150" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <circle cx="90" cy="142" r="8" fill="#334155"/>
    <path d="M74,164 q16,-14 32,0" fill="#334155"/>
    <text x="90" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Desenvolvedor</text>
    <text x="90" y="207" text-anchor="middle" font-size="11" fill="#64748b">(Azure CLI local)</text>
  </g>

  <g>
    <circle cx="90" cy="560" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <circle cx="90" cy="552" r="8" fill="#334155"/>
    <path d="M74,574 q16,-14 32,0" fill="#334155"/>
    <text x="90" y="602" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Tutor / App mobile</text>
    <text x="90" y="617" text-anchor="middle" font-size="11" fill="#64748b">(usuario final)</text>
  </g>

  <!-- GitHub -->
  <rect x="200" y="110" width="180" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="290" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="290" y="163" text-anchor="middle" font-size="11" fill="#64748b">codigo-fonte + Dockerfile</text>

  <!-- Azure CLI scripts -->
  <rect x="200" y="230" width="180" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="290" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Scripts Azure CLI</text>
  <text x="290" y="278" text-anchor="middle" font-size="11" fill="#64748b">deploy/azure/*.sh</text>
  <text x="290" y="294" text-anchor="middle" font-size="11" fill="#64748b">az group / acr / storage / container</text>

  <!-- Resource Group container -->
  <rect x="440" y="90" width="700" height="600" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="460" y="115" font-size="13" font-weight="700" fill="#4338ca">Azure - Resource Group rg-rm562917-devops (eastus2)</text>

  <!-- ACR -->
  <rect x="470" y="150" width="200" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="570" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Azure Container Registry</text>
  <text x="570" y="198" text-anchor="middle" font-size="11" fill="#64748b">2tdsarm562917</text>
  <text x="570" y="214" text-anchor="middle" font-size="11" fill="#64748b">imagem ollipet-api:v1</text>

  <!-- Storage account -->
  <rect x="470" y="500" width="200" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="570" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Azure File Share</text>
  <text x="570" y="548" text-anchor="middle" font-size="11" fill="#64748b">strm562917ollipet / pgdata</text>
  <text x="570" y="564" text-anchor="middle" font-size="11" fill="#64748b">volume persistente do Postgres</text>

  <!-- ACI Container Group -->
  <rect x="760" y="150" width="340" height="440" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="930" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Azure Container Instances</text>
  <text x="930" y="196" text-anchor="middle" font-size="11" fill="#64748b">container group "ollipet-aci" (1 IP publico)</text>

  <!-- app container -->
  <rect x="790" y="220" width="280" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="930" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">container "app"</text>
  <text x="930" y="266" text-anchor="middle" font-size="11" fill="#166534">Spring Boot - ollipet-api</text>
  <text x="930" y="282" text-anchor="middle" font-size="11" fill="#166534">porta 8080 (publica) - usuario nao-root</text>
  <text x="930" y="298" text-anchor="middle" font-size="11" fill="#166534">DATABASE_URL=jdbc:postgresql://localhost:5432</text>
  <text x="930" y="314" text-anchor="middle" font-size="10" fill="#166534" font-style="italic">(3) pull da imagem no ACR</text>

  <!-- internal link -->
  <line x1="930" y1="330" x2="930" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="965" y="352" font-size="10" fill="#334155">(4) localhost:5432</text>

  <!-- db container -->
  <rect x="790" y="370" width="280" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="930" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">container "db"</text>
  <text x="930" y="416" text-anchor="middle" font-size="11" fill="#92400e">postgres:16-alpine</text>
  <text x="930" y="432" text-anchor="middle" font-size="11" fill="#92400e">sem porta publica (so a rede interna)</text>
  <text x="930" y="448" text-anchor="middle" font-size="11" fill="#92400e">volume: Azure File Share (pgdata)</text>

  <!-- arrows: dev -> github -->
  <line x1="112" y1="140" x2="196" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="132" font-size="10" fill="#334155">(1) git push</text>

  <!-- dev -> scripts -->
  <line x1="112" y1="160" x2="200" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="215" font-size="10" fill="#334155">(2) executa scripts</text>

  <!-- github -> acr (az acr build) -->
  <path d="M380,150 C 420,150 430,190 468,192" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="140" font-size="10" fill="#334155">(3) az acr build (compila e publica)</text>

  <!-- scripts -> acr (create) -->
  <line x1="380" y1="260" x2="468" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- scripts -> storage -->
  <line x1="290" y1="320" x2="290" y2="545" stroke="#334155" stroke-width="2"/>
  <line x1="290" y1="545" x2="466" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="450" font-size="10" fill="#334155">cria resource group / storage / aci</text>

  <!-- acr -> app container (image pull) -->
  <line x1="670" y1="195" x2="788" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- storage -> db container (volume mount) -->
  <line x1="670" y1="545" x2="788" y2="450" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="490" font-size="10" fill="#334155">(5) mount do volume</text>

  <!-- tutor -> app container (public call) -->
  <path d="M112,560 C 400,560 650,300 788,270" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="330" y="605" font-size="11" fill="#0f172a" font-weight="600">(6) HTTPS -&gt; ollipet-rm562917.eastus2.azurecontainer.io:8080/api/v1/**</text>

  <!-- legend -->
  <rect x="470" y="640" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="492" y="652" font-size="11" fill="#0f172a">Container da aplicacao (exposto)</text>
  <rect x="470" y="662" width="14" height="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="492" y="674" font-size="11" fill="#0f172a">Container do banco (somente rede interna)</text>
</svg>
