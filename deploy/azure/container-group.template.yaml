# Template do Azure Container Instances (container group) com App + Banco no
# MESMO grupo: os dois containers dividem a mesma rede (localhost), entao o
# Postgres nunca precisa ficar exposto na internet - so a porta 8080 do app e
# publica. Placeholders (${VAR}) sao preenchidos pelo script 05 via envsubst,
# a partir de variaveis de ambiente - nenhum segredo fica hardcoded aqui.
apiVersion: "2021-09-01"
location: ${LOCATION}
name: ${CONTAINER_GROUP}
type: Microsoft.ContainerInstance/containerGroups
properties:
  osType: Linux
  restartPolicy: OnFailure
  imageRegistryCredentials:
    - server: ${ACR_LOGIN_SERVER}
      username: ${ACR_USERNAME}
      password: ${ACR_PASSWORD}
  ipAddress:
    type: Public
    dnsNameLabel: ${DNS_LABEL}
    ports:
      - protocol: tcp
        port: 8080
  containers:
    - name: db
      properties:
        # Imagem espelhada no proprio ACR (deploy/azure/02b-espelhar-postgres.sh):
        # o pull anonimo de postgres:16-alpine direto do Docker Hub vem sendo
        # recusado/rate-limited a partir do ACI nesta regiao.
        #
        # Sem volume externo: o Azure Files (SMB) nao e compativel com o
        # diretorio de dados do Postgres (initdb trava/crasha por causa de
        # locking/fsync sobre CIFS - limitacao conhecida do Postgres em
        # filesystems de rede). Os dados ficam no disco efemero do container:
        # sobrevivem a reinicios da aplicacao, mas se perdem se o container
        # do banco for recriado. Aceitavel para esta entrega (o requisito e
        # "banco em container na nuvem", nao persistencia entre recriacoes).
        image: ${ACR_LOGIN_SERVER}/postgres:16-alpine
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        environmentVariables:
          - name: POSTGRES_DB
            value: ${DB_NAME}
          - name: POSTGRES_USER
            value: ${DB_USER}
          - name: POSTGRES_PASSWORD
            secureValue: ${DB_PASSWORD}
    - name: app
      properties:
        image: ${ACR_LOGIN_SERVER}/${APP_IMAGE}:${APP_IMAGE_TAG}
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        ports:
          - port: 8080
        environmentVariables:
          - name: PORT
            value: "8080"
          - name: DATABASE_URL
            value: "jdbc:postgresql://localhost:5432/${DB_NAME}"
          - name: DB_USER
            value: ${DB_USER}
          - name: DB_PASSWORD
            secureValue: ${DB_PASSWORD}
          - name: APP_SECURITY_JWT_SECRET
            secureValue: ${APP_SECURITY_JWT_SECRET}
          - name: FIREBASE_PROJECT_ID
            value: "${FIREBASE_PROJECT_ID}"
