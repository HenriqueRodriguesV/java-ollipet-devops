# Perfil usado pelos testes (@SpringBootTest). Sobe um H2 em memoria em vez de
# exigir um Postgres real disponivel durante o build/CI.
spring.datasource.url=jdbc:h2:mem:ollipet_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
