spring.application.name=challenge_clyvo
# O Render (e a maioria dos PaaS) injeta a porta via variavel PORT e derruba o
# servico se a aplicacao escutar em outra. Localmente continua em 8080.
server.port=${PORT:8080}

springdoc.info.title=API Olli Pet - Clyvo Challenge
springdoc.info.description=API para gerenciamento de pets, responsaveis, veterinarios, consultas e vacinacao
springdoc.info.version=v2.0.0

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true

# Banco PostgreSQL. Localmente aponta para o container subido pelo
# docker-compose (servico "db"); em nuvem, sobrescrever via variavel de
# ambiente DATABASE_URL (ex.: jdbc:postgresql://<host-ou-ip-do-container>:5432/ollipet).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ollipet}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:ollipet}
spring.datasource.password=${DB_PASSWORD:ollipet}

# O schema e criado e versionado exclusivamente pelo Flyway. O Hibernate apenas confere
# se as entidades batem com as migrations; se divergir, a aplicacao nao sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Chave HMAC dos tokens emitidos pela propria API (Swagger, Insomnia e testes).
# Em producao, sobrescrever via variavel de ambiente APP_SECURITY_JWT_SECRET.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:clyvo-ollipet-chave-de-desenvolvimento-com-256-bits-minimo}
app.security.jwt.expiracao-minutos=480

# Preencher com o ID do projeto Firebase usado pelo app mobile para que a API
# aceite os ID tokens emitidos pelo Firebase Authentication. Vazio = desligado.
app.security.firebase.project-id=${FIREBASE_PROJECT_ID:olli-pet-ca74e}

# Regras de agendamento
app.agenda.duracao-consulta-minutos=30
app.agenda.antecedencia-minima-cancelamento-horas=6
app.agenda.hora-abertura=08:00
app.agenda.hora-fechamento=18:00

# Quantos dias antes do vencimento uma dose ja entra como "a vencer"
app.vacinacao.dias-alerta-vencimento=30

# Regras da triagem
app.triagem.validade-horas=24
app.triagem.limite-por-pet-em-24h=10
app.triagem.dias-consulta-recente=15

# Regras do tratamento
# Depois da tolerancia, uma dose nao confirmada passa a contar como perdida
app.tratamento.tolerancia-confirmacao-horas=2
app.tratamento.maximo-doses=120
app.tratamento.limite-aderencia-baixa=70

# Origens que podem chamar a API pelo navegador. O padrao cobre o Expo em
# desenvolvimento; em producao, defina APP_CORS_ORIGENS com o dominio do app.
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081}
